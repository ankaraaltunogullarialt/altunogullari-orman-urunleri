services:
  - type: web
    name: altunogullari-orman-urunleri
    env: python
    plan: free
    region: frankfurt
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
    startCommand: |
      gunicorn fabrika.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "tomruktakipalt.com,www.tomruktakipalt.com,.onrender.com"
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.8"
